services:

  app:
    build: .
    container_name: app
    volumes:
      - .:/var/www
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: ip_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ip_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db

volumes:
  dbdata:
